services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plugin_market
      POSTGRES_USER: plugin_market
      POSTGRES_PASSWORD: plugin_market
    volumes:
      - plugin_market_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plugin_market -d plugin_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - plugin_market_media:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  plugin_market_pgdata:
  plugin_market_media:
