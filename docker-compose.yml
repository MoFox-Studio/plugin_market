services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plugin_market
      POSTGRES_USER: plugin_market
      POSTGRES_PASSWORD: plugin_market
    ports:
      - "5432:5432"
    volumes:
      - plugin_market_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plugin_market -d plugin_market"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.example
    ports:
      - "8787:8787"

volumes:
  plugin_market_pgdata:
