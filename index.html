<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoFox Plugin Market · PR 预览</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314110f'/%3E%3Cpath d='M8 23V10h3.4l4.6 6.8 4.6-6.8H24v13h-3.2v-7.6L16 22.2l-4.8-6.8V23z' fill='%23f08a3c'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #14110f;
    --panel: #1d1916;
    --line: #332c27;
    --text: #efe6dc;
    --muted: #9b8f84;
    --accent: #f08a3c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 15% -10%, #2a1d12 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    justify-content: center;
    padding: 64px 24px 96px;
  }
  main { width: 100%; max-width: 720px; }
  .kicker {
    margin: 0 0 8px;
    font-size: 12px;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0 0 14px;
    font: 400 clamp(34px, 6vw, 54px)/1.1 Georgia, "Songti SC", "Noto Serif SC", serif;
    letter-spacing: -.01em;
  }
  h1 em { font-style: italic; color: var(--accent); }
  .lede { margin: 0 0 44px; color: var(--muted); max-width: 46ch; }
  h2 {
    margin: 0 0 16px;
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li a {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 16px 20px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    color: var(--text);
    text-decoration: none;
    transition: border-color .15s ease, transform .15s ease, background .15s ease;
  }
  li a:hover {
    border-color: var(--accent);
    background: #241d18;
    transform: translateY(-1px);
  }
  .num {
    font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--accent);
  }
  .label { flex: 1; }
  .go { color: var(--muted); font-size: 13px; }
  .muted { color: var(--muted); padding: 16px 20px; border: 1px dashed var(--line); border-radius: 10px; }
  footer {
    margin-top: 48px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 24px;
    font-size: 14px;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<main>
  <p class="kicker">MoFox Studio</p>
  <h1>Plugin Market <em>PR&nbsp;Previews</em></h1>
  <p class="lede">
    每个改动前端的 PR 都会生成一个独立的静态预览站，使用内置模拟数据，
    不连接生产后端。PR 关闭后预览会自动移除。
  </p>

  <section>
    <h2>当前可用预览</h2>
    <ul id="list">
      <li class="muted">正在读取预览列表…</li>
    </ul>
  </section>

  <footer>
    <a href="https://market.mofox-sama.com" rel="noopener">生产站 →</a>
    <a href="https://github.com/MoFox-Studio/plugin_market" rel="noopener">GitHub 仓库 →</a>
    <a href="https://github.com/MoFox-Studio/plugin_market/pulls" rel="noopener">Pull requests →</a>
  </footer>
</main>

<script>
(function () {
  var REPO = "MoFox-Studio/plugin_market";
  var list = document.getElementById("list");

  function setMessage(text) {
    list.innerHTML = "";
    var li = document.createElement("li");
    li.className = "muted";
    li.textContent = text;
    list.appendChild(li);
  }

  function render(numbers) {
    numbers = (numbers || [])
      .map(Number)
      .filter(function (n) { return Number.isInteger(n) && n > 0; })
      .sort(function (a, b) { return b - a; });

    if (numbers.length === 0) {
      setMessage("目前没有打开的前端预览。");
      return;
    }

    list.innerHTML = "";
    numbers.forEach(function (number) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = "pr-preview/pr-" + number + "/";
      a.innerHTML =
        '<span class="num">#' + number + '</span>' +
        '<span class="label">PR #' + number + ' 前端预览</span>' +
        '<span class="go">打开 →</span>';
      li.appendChild(a);
      list.appendChild(li);
    });
  }

  // 优先读取部署时生成的静态索引，不受 GitHub API 限流影响。
  function fromApi() {
    return fetch("https://api.github.com/repos/" + REPO + "/contents/pr-preview?ref=gh-pages", {
      headers: { Accept: "application/vnd.github+json" }
    })
      .then(function (res) {
        if (res.status === 404) return [];
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (items) {
        return (Array.isArray(items) ? items : [])
          .filter(function (item) {
            return item.type === "dir" && /^pr-\d+$/.test(item.name);
          })
          .map(function (item) { return Number(item.name.slice(3)); });
      });
  }

  fetch("previews.json", { cache: "no-store" })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (index) { render(index && index.previews); })
    .catch(function () {
      fromApi()
        .then(render)
        .catch(function () {
          setMessage("暂时无法读取预览列表，可以直接访问 pr-preview/pr-<编号>/。");
        });
    });
})();
</script>
</body>
</html>
