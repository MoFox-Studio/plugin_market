# PR 前端预览
#
# 作用：当 PR 修改了 frontend/ 时，自动构建前端并发布到 GitHub Pages 的
# pr-preview/pr-<编号>/ 目录，同时在 PR 中维护一条中文预览评论；PR 关闭后自动清理。
#
# 首次使用前需要仓库管理员完成两项设置：
#   1. Settings → Pages → Build and deployment → Source 选择
#      "Deploy from a branch"，分支选 gh-pages，目录选 / (root)。
#   2. Settings → Actions → General → Workflow permissions 选择
#      "Read and write permissions"（允许 Action 推送 gh-pages 分支）。
#
# 说明：
#   - 预览页面使用内置模拟数据（VITE_PREVIEW_MOCK=1），不连接生产后端。
#   - 来自 fork 的 PR 无法写入仓库，因此只做构建校验，不发布预览。
#   - 预览地址形如 https://<owner>.github.io/<repo>/pr-preview/pr-123/

name: 前端 PR 预览

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# 发布预览需要写 gh-pages 分支，并在 PR 中发表评论
permissions:
  contents: write
  pull-requests: write
  pages: write
  deployments: read

# 同一个 PR 只保留最后一次构建，避免评论与部署不同步
concurrency:
  group: frontend-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_BRANCH: gh-pages
  UMBRELLA_DIR: pr-preview
  SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

jobs:
  changes:
    name: 检测前端改动
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 过滤 frontend 改动
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/pr-frontend-preview.yml'

  preview:
    name: 构建并发布预览
    needs: changes
    if: |
      always() && (
        github.event.action == 'closed' ||
        needs.changes.outputs.frontend == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装 Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        if: github.event.action != 'closed'
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 构建前端（内置模拟数据）
        if: github.event.action != 'closed'
        working-directory: frontend
        env:
          VITE_PREVIEW_MOCK: '1'
          VITE_ROUTER_MODE: hash
          VITE_PR_NUMBER: ${{ github.event.pull_request.number }}
          VITE_PR_URL: ${{ github.event.pull_request.html_url }}
        run: >
          npm run build --
          --outDir dist
          --base "/${{ github.event.repository.name }}/${{ env.UMBRELLA_DIR }}/pr-${{ github.event.pull_request.number }}/"

      - name: 部署或清理 PR 预览
        id: preview
        if: env.SAME_REPO == 'true'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: frontend/dist
          preview-branch: ${{ env.PREVIEW_BRANCH }}
          umbrella-dir: ${{ env.UMBRELLA_DIR }}
          action: ${{ github.event.action == 'closed' && 'remove' || 'deploy' }}
          comment: false
          qr-code: false

      # 如果仓库还没有启用 Pages，尝试以 gh-pages 分支为来源启用。
      # GITHUB_TOKEN 通常没有仓库管理权限，失败时忽略即可，由管理员手动设置。
      - name: 首次运行时尝试启用 GitHub Pages
        if: env.SAME_REPO == 'true' && github.event.action != 'closed'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" --input - >/dev/null <<'JSON'
          {"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}
          JSON
            echo "::notice::已尝试启用 GitHub Pages（来源：gh-pages 分支）"
          fi

      - name: 在 PR 中回复预览地址
        if: success() && env.SAME_REPO == 'true' && steps.preview.outputs.deployment-action == 'deploy'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: frontend-preview
          message: |
            ## 🛫 前端预览已就绪

            | 项目 | 内容 |
            | --- | --- |
            | 预览地址 | ${{ steps.preview.outputs.preview-url }} |
            | 本次提交 | [`${{ github.event.pull_request.head.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}) |
            | 数据来源 | 内置模拟数据，不连接生产后端 |

            > 预览中的登录、评论、发布等写操作不可用。
            > 每次推送新提交会自动更新此预览，PR 关闭后自动清理。
            > 首次部署后 GitHub Pages 可能需要 30–60 秒完成构建，请稍后再打开链接。

      - name: PR 关闭后更新评论
        if: success() && env.SAME_REPO == 'true' && steps.preview.outputs.deployment-action == 'remove'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: frontend-preview
          message: |
            ## 🛬 前端预览已清理

            该 PR 已关闭，`${{ env.UMBRELLA_DIR }}/pr-${{ github.event.pull_request.number }}` 已从 `${{ env.PREVIEW_BRANCH }}` 分支移除。

      - name: 构建或部署失败提示
        if: failure() && env.SAME_REPO == 'true' && github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: frontend-preview
          message: |
            ## ❌ 前端预览构建或部署失败

            请查看 [Action 运行日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) 定位问题。

      - name: 写入任务摘要
        if: always()
        run: |
          {
            echo "## 前端 PR 预览"
            echo ""
            if [ "${SAME_REPO}" != "true" ]; then
              echo "- 来自 fork 的 PR 只做构建校验，不发布预览（GITHUB_TOKEN 对 fork 只读）。"
            elif [ "${{ steps.preview.outputs.deployment-action }}" = "deploy" ]; then
              echo "- 预览地址：${{ steps.preview.outputs.preview-url }}"
              echo "- 提交：\`${{ github.event.pull_request.head.sha }}\`"
            elif [ "${{ steps.preview.outputs.deployment-action }}" = "remove" ]; then
              echo "- PR 已关闭，预览目录已清理。"
            else
              echo "- 本次运行未部署预览。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
