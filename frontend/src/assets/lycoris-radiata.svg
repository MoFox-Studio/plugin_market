<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" color="#78333d" role="img" aria-labelledby="lycoris-title lycoris-desc">
  <title id="lycoris-title">彼岸花图版</title>
  <desc id="lycoris-desc">细长的无叶花茎托起伞形花序，六枚反卷的花被片之间伸出弯曲的长花丝。右下角署名 design by Lycoris radiata。</desc>
  <style>@media (prefers-color-scheme: dark) { :root { color: #e0a09b } }</style>
  <defs>
    <!-- A narrow tepal turns back upon itself. A second line follows the fold. -->
    <g id="lycoris-tepal" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0C-3-10-11-18-13-31c-2-11 0-22 7-25 6-3 12 2 10 9-1 5-5 8-9 9 4-5 6-9 4-12-2-4-6-2-8 3-4 10 0 21 4 30C-2-10 0-5 0 0Z" stroke-width="1.65"/>
      <path d="M-2-7c-3-9-9-21-9-31 0-8 3-13 7-15" stroke-width=".65"/>
    </g>
    <g id="lycoris-floret" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <!-- The six irregularly splayed tepals project away from the throat. -->
      <use href="#lycoris-tepal" transform="rotate(-79) scale(.88 .78)"/>
      <use href="#lycoris-tepal" transform="rotate(-43) scale(.78 .92)"/>
      <use href="#lycoris-tepal" transform="rotate(-9) scale(.81 .97)"/>
      <use href="#lycoris-tepal" transform="rotate(27) scale(-.78 .88)"/>
      <use href="#lycoris-tepal" transform="rotate(61) scale(-.76 .93)"/>
      <use href="#lycoris-tepal" transform="rotate(103) scale(-.75 .8)"/>
      <!-- Six filaments emerge together, each carrying its own oval anther. -->
      <g stroke-width="1.18">
        <path d="M-1-1C-13-16-42-29-48-58c-2-9-1-17 0-22"/>
        <path d="M0-1C-10-20-28-42-26-68c0-9 3-16 5-21"/>
        <path d="M0-2C-5-24-8-50 0-72c4-11 8-18 13-24"/>
        <path d="M1-2C4-22 12-45 28-62c8-8 16-14 26-17"/>
        <path d="M1-1c13-21 28-37 52-45 9-3 18-4 26-3"/>
        <path d="M2-1c19-13 38-26 63-24 9 1 15 3 20 6"/>
      </g>
      <g fill="currentColor" stroke="none">
        <ellipse cx="-48" cy="-80" rx="2.9" ry="1.05" transform="rotate(-52 -48 -80)"/>
        <ellipse cx="-21" cy="-89" rx="3.1" ry="1.1" transform="rotate(-37 -21 -89)"/>
        <ellipse cx="13" cy="-96" rx="3" ry="1.1" transform="rotate(-24 13 -96)"/>
        <ellipse cx="54" cy="-79" rx="3.2" ry="1.1" transform="rotate(-10 54 -79)"/>
        <ellipse cx="79" cy="-49" rx="3.2" ry="1.15" transform="rotate(18 79 -49)"/>
        <ellipse cx="85" cy="-19" rx="3" ry="1.15" transform="rotate(30 85 -19)"/>
      </g>
    </g>
    <symbol id="lycoris-radiata" viewBox="0 0 320 260">
      <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <!-- One leafless scape and five pedicels radiating from a common point. -->
        <path d="M103 226c8-20 14-36 18-59 2-12 2-19 1-26M108 226c8-21 15-42 17-61 1-12 1-18 0-24" stroke-width="1.6"/>
        <path d="M107 221c6-17 12-35 15-53m1-8c.5-6 .5-10 0-14" stroke-width=".7"/>
        <path d="M124 143c-11-13-27-21-45-31m44 30c-3-15-7-29-15-42m16 41c4-25 9-41 19-57m-18 58c12-17 27-32 43-39m-43 39c18-3 35-7 54-15" stroke-width="1.7"/>
        <path d="M124 145c-6-5-9-8-15-11 6 1 12 3 15 7 4-4 8-7 13-9-4 6-8 10-13 13Z" stroke-width="1.1"/>
        <use href="#lycoris-floret" transform="translate(107 100) rotate(-29) scale(.67 .73)"/>
        <use href="#lycoris-floret" transform="translate(143 84) rotate(14) scale(.61 .69)"/>
        <use href="#lycoris-floret" transform="translate(79 112) rotate(-71) scale(.66 .7)"/>
        <use href="#lycoris-floret" transform="translate(168 103) rotate(47) scale(.74 .8)"/>
        <use href="#lycoris-floret" transform="translate(179 127) rotate(76) scale(.65 .7)"/>
      </g>
      <text x="315" y="252" text-anchor="end" fill="currentColor" font-family="Georgia, 'Times New Roman', serif" font-size="18.5" font-style="italic">design by Lycoris radiata</text>
    </symbol>
  </defs>
  <use href="#lycoris-radiata" width="320" height="260"/>
</svg>
