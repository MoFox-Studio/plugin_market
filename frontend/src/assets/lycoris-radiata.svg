<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="lycoris-title lycoris-desc">
  <title id="lycoris-title">彼岸花 · 植物铜版图</title>
  <desc id="lycoris-desc">四朵朝向各异的彼岸花与一枚初开的花苞，从同一无叶花茎顶端伸展。每朵花的六枚细长花被片向后翻卷，弧形长花丝末端悬着花药。右侧附花被片与花药的细部图，右下角署名 design by Lycoris radiata。</desc>
