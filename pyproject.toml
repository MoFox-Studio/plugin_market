[project]
name = "plugin-market-backend"
version = "0.1.0"
description = "Production-ready backend for the Neo-MoFox plugin market API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.0",
    "alembic>=1.17.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.128.0",
    "packaging>=26.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.8.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plugin_market_backend", "src/plugin_market_mock"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
