<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neo-MoFox Plugin Market</title>
  <meta name="description" content="Neo-MoFox 插件市场 · 发现、评价并参与共建优秀插件生态。">
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="topbar" data-topbar>
    <a class="brand" href="/" data-route="/">
      <img class="brand-logo" src="/assets/logo.png" alt="Neo-MoFox">
      <span class="brand-text">
        <b>Neo-MoFox</b>
        <span>Plugin Market</span>
      </span>
    </a>
    <form class="topbar-search" data-search-form role="search">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input type="search" name="q" placeholder="搜索插件、作者、标签…" autocomplete="off" data-search-input>
      <button type="submit" class="btn btn-primary btn-sm">搜索</button>
    </form>
    <nav class="topbar-nav" data-topbar-nav>
      <a class="navlink" href="/" data-route="/">市场</a>
      <a class="navlink" href="/me" data-route="/me">我的</a>
      <span data-auth-slot></span>
    </nav>
    <button class="mobile-menu-toggle" data-mobile-toggle aria-label="菜单">☰</button>
  </header>

  <div class="toast" data-toast hidden></div>

  <main class="shell" data-app>
    <div class="loading-screen" data-boot>正在加载市场…</div>
  </main>

  <footer class="footer">
    <div class="shell footer-inner">
      <div>
        <img class="footer-logo" src="/assets/logo.png" alt="Neo-MoFox">
        <p>Neo-MoFox 插件社区 · 基于开放治理中枢</p>
      </div>
      <div class="footer-links">
        <a href="https://github.com/MoFox-Studio" target="_blank" rel="noreferrer noopener">GitHub</a>
        <a href="/admin" data-route="/admin">管理后台</a>
        <a href="/health" target="_blank" rel="noreferrer noopener">服务状态</a>
      </div>
    </div>
  </footer>

  <script src="/assets/app.js"></script>
</body>
</html>
